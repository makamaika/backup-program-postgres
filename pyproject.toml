[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "pgbackup"
version = "0.1.0"
description = "PostgreSQL backup / restore / versioning tool with CLI and local Web UI"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = [
    "psycopg[binary]>=3.2",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
]

[project.scripts]
pgbackup = "pgbackup.cli:main"

[tool.setuptools.packages.find]
include = ["pgbackup*"]

[tool.setuptools.package-data]
"pgbackup.web" = ["static/*"]
